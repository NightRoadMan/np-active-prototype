<title>Онбординг НаПоправку</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky control bar on top, one device (or a grid of all devices) on a quiet stage below. */
:root {
  --bg: #eef1f2;
  --panel: #ffffff;
  --ink: #0d0d0d;
  --muted: #6c6c72;
  --line: #dfe3e5;
  --seg: #f1f3f4;
  --seg-on: #0d0d0d;
  --seg-on-ink: #ffffff;
  --accent: #3a8f9e;
  --shadow: 0 1px 2px rgba(13,13,13,.06), 0 12px 40px rgba(13,13,13,.10);
  --font: "Montserrat", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213; --panel: #1b1c1e; --ink: #f2f2f3; --muted: #9a9aa0; --line: #2c2e31;
    --seg: #232427; --seg-on: #f2f2f3; --seg-on-ink: #111213; --accent: #61b7c6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111213; --panel: #1b1c1e; --ink: #f2f2f3; --muted: #9a9aa0; --line: #2c2e31;
  --seg: #232427; --seg-on: #f2f2f3; --seg-on-ink: #111213; --accent: #61b7c6;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

/* ---------- control bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--muted); font-weight: 500; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; background: var(--seg); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  font: 600 13px/1 var(--font); color: var(--ink); background: transparent; border: 0;
  padding: 9px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
}
.seg button:hover { background: color-mix(in srgb, var(--seg-on) 8%, transparent); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-ink); }
.seg button:focus-visible, .link:focus-visible, .cell:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg[data-disabled="true"] { opacity: .4; pointer-events: none; }

/* ---------- stage ---------- */
main { padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.single { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.fit { position: relative; }
.fit > .device { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.device { width: 375px; height: 812px; border-radius: 32px; box-shadow: var(--shadow); }
.caption { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); font-weight: 500; text-align: center; }
.caption strong { color: var(--ink); font-weight: 600; }
.link { color: var(--accent); font-weight: 600; text-decoration: none; }
.link:hover { text-decoration: underline; }
.hint { font-size: 12px; color: var(--muted); }
kbd { font: 600 11px/1 var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--panel); color: var(--ink); }

.all { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.all-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.all-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.zoom { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.zoom button { font: 600 13px/1 var(--font); width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.zoom output { min-width: 42px; text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-direction: column; gap: 12px; }
.row h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grid { display: flex; flex-wrap: wrap; gap: 24px; }
.cell .device { pointer-events: none; }
.cell { display: flex; flex-direction: column; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font: inherit; border-radius: 12px; }
.cell span { font-size: 13px; font-weight: 600; }
.cell .device { transition: transform .15s ease; }
.cell:hover .fit { transform: translateY(-2px); }
.fit { transition: transform .15s ease; }

@media (max-width: 720px) { .bar { position: static; } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* =================================================================
   Mockup — values copied from Figma, light/dark are the design's own
   ================================================================= */
.scr {
  --m-base: #ffffff; --m-accent: #f4f5f6; --m-text: #0d0d0d; --m-light: #929297;
  --m-tint: #e6f4f6; --m-canvas: #f4f5f6; --m-glass: rgba(244,245,246,.6);
  --m-nav: linear-gradient(180deg, #ffffff 5.682%, rgba(255,255,255,0) 100%);
  --m-nav-mask: linear-gradient(180deg, #000 5.682%, transparent 45%);
  position: relative; width: 375px; height: 812px; overflow: hidden; border-radius: 32px;
  font-family: "Montserrat", system-ui, sans-serif; color: var(--m-text);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-synthesis: none;
  background: var(--m-tint); isolation: isolate; text-align: left;
}
.scr.dark {
  --m-base: #1a1a1a; --m-accent: #272728; --m-text: #ffffff; --m-light: #7a7a7f;
  --m-tint: #213a3e; --m-canvas: #0d0d0d; --m-glass: rgba(93,94,99,.5);
  --m-nav: linear-gradient(180deg, #1a1a1a 0%, rgba(26,26,26,0) 100%);
  --m-nav-mask: linear-gradient(180deg, #000 0%, transparent 45%);
}
.scr.bg-canvas { background: var(--m-canvas); }
.scr * { box-sizing: border-box; }
.scr p { margin: 0; }
.hero { position: absolute; display: block; max-width: none; object-fit: cover; pointer-events: none; user-select: none; }

.nav { position: absolute; left: 0; top: 0; width: 375px; height: 88px; background: var(--m-nav); z-index: 2; }
/* Figma fades a background blur with its fill opacity, so the blur follows the same gradient */
.nav::before { content: ""; position: absolute; inset: 0; z-index: -1; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  -webkit-mask-image: var(--m-nav-mask); mask-image: var(--m-nav-mask); }
.sb { position: relative; height: 44px; overflow: hidden; }
.sb .time { position: absolute; left: 29px; top: 16px; font: 600 15px/18px -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; letter-spacing: .374px; color: var(--m-text); white-space: nowrap; }
.sb svg { position: absolute; right: 14.67px; top: 19.33px; width: 66.66px; height: 11.34px; overflow: visible; color: var(--m-text); }
.tb { position: relative; height: 44px; padding: 0 16px 12px; }
.back { position: relative; width: 44px; height: 44px; border: 0; padding: 0; border-radius: 1000px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--m-text); }
.back::before { content: ""; position: absolute; inset: 0; border-radius: 1000px; background: var(--m-glass);
  box-shadow: 1.25px 0 0 -0.75px #d0d0d0, -1.25px 0 0 -0.75px #d0d0d0, 0 0 0 .5px #e8e8e8, 0 8px 15px rgba(0,0,0,.02);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.back svg { position: relative; width: 24px; height: 24px; }
.back:active { transform: scale(.94); }
.logo { position: absolute; left: calc(50% + .5px); top: 12px; width: 107px; height: 20px; transform: translateX(-50%); color: var(--m-text); }
.logo svg { position: absolute; left: 1.6787px; top: 2.9688px; width: 104.85px; height: 14.21px; overflow: visible; }

.title { font-weight: 700; font-size: 22px; line-height: 28px; }
.desc { font-weight: 500; font-size: 16px; line-height: 24px; font-feature-settings: "liga" 0; }
.list { display: flex; flex-direction: column; gap: 12px; width: 343px; }
.item { display: flex; gap: 8px; align-items: flex-start; }
.item img { width: 40px; height: 40px; flex: none; display: block; max-width: none; }
.item .tx { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; justify-content: center; font-feature-settings: "liga" 0; }
.item b { font-weight: 600; font-size: 14px; line-height: 20px; }
.item i { font-style: normal; font-weight: 500; font-size: 13px; line-height: 18px; color: var(--m-light); }

.foot { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
.cta { position: relative; width: 343px; height: 56px; border: 0; border-radius: 20px; cursor: pointer; color: #fff;
  font: 600 16px/16px "Montserrat", system-ui, sans-serif; font-feature-settings: "liga" 0; transition: filter .12s ease, transform .12s ease; }
.cta:hover { filter: brightness(1.04); }
.cta:active { transform: scale(.985); filter: brightness(.95); }
.cta svg { position: absolute; right: 16px; top: 16px; width: 24px; height: 24px; }
.home { position: relative; height: 30px; width: 100%; }
.home::after { content: ""; position: absolute; left: calc(50% + .5px); bottom: 9px; width: 134px; height: 5px; border-radius: 100px; transform: translateX(-50%); background: var(--m-text); }

/* Variant 1: photo + bottom sheet */
.v1 .sheet { position: absolute; left: 0; bottom: 0; width: 375px; height: 466px; background: var(--m-base);
  border-radius: 24px 24px 0 0; padding: 16px 16px 0; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; z-index: 3; }
.v1 .content { display: flex; flex-direction: column; gap: 8px; width: 343px; }


.anim-in { animation: fadein .22s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateX(var(--dx, 12px)); } to { opacity: 1; transform: none; } }
</style>
</head>

615 2.698)" d="M2.914 11.517C2.119 11.517 1.377 11.313.678 10.907L1.524 9.093C1.91 9.323 2.27 9.44 2.599 9.44C2.998 9.44 3.287 9.247 3.475 8.863L0 0L2.666 0L4.684 6.013L6.621 0L9.236 0L5.825 9.043C5.483 9.953 5.097 10.593 4.667 10.963C4.24 11.33 3.653 11.517 2.914 11.517Z"/></g></svg>`;

const CHEV_L = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7L9 12L14 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_R = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7L15 12L10 17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const navBar = () => `<div class="nav"><div class="sb"><span class="time">10:10</span>${ICON_SB}</div>
  <div class="tb"><button class="back" data-act="back" aria-label="Назад">${CHEV_L}</button><div class="logo">${ICON_LOGO}</div></div></div>`;
const list = (s, theme) => `<div class="list">${s.items.map((it, i) =>
  `<div class="item"><img alt="" src="${ASSETS[`ic_${theme}_${s.id}_${i}`]}"><div class="tx"><b>${it[0]}</b><i>${it[1]}</i></div></div>`).join("")}</div>`;
const foot = (s) => `<div class="foot"><button class="cta" data-act="next" style="background:${s.btn}">Дальше${CHEV_R}</button><div class="home"></div></div>`;

function screenHTML(si, theme) {
  const s = SCREENS[si], h = s.h1;
  return `<div class="scr v1 ${theme}${s.bg1 === "canvas" ? " bg-canvas" : ""}">
    <img class="hero" alt="" src="${ASSETS[h.k]}" style="left:${h.l}px;top:${h.t}px;width:${h.w}px;height:${h.h}px">
    ${navBar()}
    <div class="sheet"><div class="content"><p class="title">${s.t1}</p><p class="desc">${s.desc}</p>${list(s, theme)}</div>${foot(s)}</div>
  </div>`;
}

/* ---------- state ---------- */
const state = { screen: 0, theme: "light", mode: "one", zoom: 0.6 };
try { Object.assign(state, JSON.parse(localStorage.getItem("np-onb-v1") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("np-onb-v1", JSON.stringify(state)); } catch (e) {} };

function seg(el, opts, key) {
  el.innerHTML = opts.map(([v, label]) => `<button type="button" data-v="${v}" aria-pressed="${String(state[key]) === String(v)}">${label}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
    const v = b.dataset.v; state[key] = isNaN(+v) ? v : +v; save(); render(key === "screen" ? 0 : null); };
}
function controls() {
  seg(document.getElementById("seg-screen"), SCREENS.map((s, i) => [i, s.name]), "screen");
  seg(document.getElementById("seg-theme"), [["light", "Светлая"], ["dark", "Тёмная"]], "theme");
  seg(document.getElementById("seg-mode"), [["one", "Один экран"], ["all", "Все экраны"]], "mode");
  const all = state.mode === "all";
  document.getElementById("seg-screen").dataset.disabled = all;
}

const stage = document.getElementById("stage");
function fitBox(inner, scale, inert) {
  return `<div class="fit" style="width:${375 * scale}px;height:${812 * scale}px"><div class="device"${inert ? " inert" : ""} style="transform:scale(${scale})">${inner}</div></div>`;
}
function singleScale() {
  const cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return Math.min(1, Math.max(0.3, w / 375));
}
function render(dir) {
  controls();
  if (state.mode === "all") {
    const z = state.zoom;
    stage.innerHTML = `<section class="all">
      <div class="all-head"><h2>Все экраны · ${state.theme === "dark" ? "тёмная тема" : "светлая тема"}</h2>
        <div class="zoom"><span>Масштаб</span><button type="button" id="z-minus" aria-label="Уменьшить">−</button><output id="zv">${Math.round(z * 100)}%</output><button type="button" id="z-plus" aria-label="Увеличить">+</button></div></div>
      <div class="grid">${SCREENS.map((s, i) =>
        `<div class="cell" role="button" tabindex="0" aria-label="Открыть: ${s.name}" data-open="${i}"><span>${s.name}</span>${fitBox(screenHTML(i, state.theme), z, true)}</div>`).join("")}</div>
    </section>`;
    stage.querySelector("#z-minus").onclick = () => { state.zoom = Math.max(0.3, +(state.zoom - 0.1).toFixed(2)); save(); render(); };
    stage.querySelector("#z-plus").onclick = () => { state.zoom = Math.min(1, +(state.zoom + 0.1).toFixed(2)); save(); render(); };
    return;
  }
  const s = SCREENS[state.screen];
  const sc = singleScale();
  const node = s.nodes[state.theme];
  stage.innerHTML = `<section class="single">
    ${fitBox(screenHTML(state.screen, state.theme), sc)}
    <div class="caption"><span><strong>${s.name}</strong> · ${state.theme === "dark" ? "тёмная" : "светлая"}</span>
      <a class="link" href="${FILE}${node}" target="_blank" rel="noopener">Открыть в Figma ↗</a></div>
    <div class="hint">«Дальше» и стрелка «назад» в макете листают экраны. Клавиши: <kbd>←</kbd> <kbd>→</kbd> экран, <kbd>T</kbd> тема, <kbd>A</kbd> все экраны</div>
  </section>`;
  if (dir) { const d = stage.querySelector(".scr"); d.style.setProperty("--dx", dir > 0 ? "14px" : "-14px"); d.classList.add("anim-in"); }
}
function go(delta) { state.screen = (state.screen + delta + SCREENS.length) % SCREENS.length; save(); render(delta); }

stage.addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]");
  if (state.mode === "all" && open) { state.screen = +open.dataset.open; state.mode = "one"; save(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  go(a.dataset.act === "next" ? 1 : -1);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.closest && e.target.closest(".cell")) { e.target.click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright" && state.mode === "one") go(1);
  else if (k === "arrowleft" && state.mode === "one") go(-1);
  else if (k === "t" || k === "е") { state.theme = state.theme === "light" ? "dark" : "light"; save(); render(); }
  else if (k === "a" || k === "ф") { state.mode = state.mode === "all" ? "one" : "all"; save(); render(); }
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.mode === "one") render(); }, 120); });
render();
</script>
